# kkt in Docker, served over HTTPS on your tailnet by a Tailscale container.
#   cp .env.example .env     # then fill in the values
#   docker compose -f compose.tailscale.yaml up -d
#   docker compose -f compose.tailscale.yaml exec kkt kkt key show
# kkt and Tailscale are separate containers on the Compose network. Tailscale
# Serve proxies HTTPS 443 to http://kkt:7420 (see tailscale/serve.json), and
# only the Tailscale container is on the tailnet. kkt is also published on
# the host's loopback, for programs on this machine. Either container can be
# restarted alone.

services:
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:?set TS_HOSTNAME in .env}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun and no extra capabilities.
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro

  kkt:
    image: ghcr.io/sam-mfb/kashkeshet:latest
    restart: unless-stopped
    ports:
      # The host's loopback only. Do not drop the 127.0.0.1.
      - "127.0.0.1:7420:7420"
    volumes:
      - kkt-data:/data
    command:
      - serve
      - --bind
      - 0.0.0.0:7420
      - --allow-any-bind
      - --allow-host
      - ${TS_HOSTNAME}.${TS_TAILNET:?set TS_TAILNET in .env}

volumes:
  kkt-data:
  tailscale-state:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Chat{% endblock %}</title>
<style>
:root {
  --bg: #fbfbfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
  --accent: #2f5fd0; --chip: #efefeb; --new: #fff6d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17171a; --fg: #e8e8ea; --muted: #9a9aa2; --line: #2c2c31;
          --accent: #8fb0ff; --chip: #24242a; --new: #3a3420; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 16px; align-items: baseline; }
header a.home { font-weight: 600; color: var(--fg); text-decoration: none; }
header .live { color: var(--muted); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 4px 0 8px; }
h2 { font-size: 16px; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.mono, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
.scroll { overflow-x: auto; }
ol.messages { list-style: none; padding: 0; margin: 0; }
ol.messages li { padding: 6px 0; border-bottom: 1px solid var(--line); }
ol.messages li.new { background: var(--new); transition: background 2s; }
.meta { color: var(--muted); font-size: 13px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <a class="home" href="/">Agent Chat</a>
  <span class="live" id="live">connecting…</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// Appends new messages to any list marked with data-live. A list with
// data-channel only takes messages from that channel.
(function () {
  const status = document.getElementById("live");
  const lists = document.querySelectorAll("ol[data-live]");
  const source = new EventSource("/events");
  source.onopen = () => { status.textContent = "live"; };
  source.onerror = () => { status.textContent = "reconnecting…"; };
  source.addEventListener("lagged", () => { location.reload(); });
  source.addEventListener("message", (e) => {
    const m = JSON.parse(e.data);
    lists.forEach((list) => {
      const only = list.dataset.channel;
      if (only && only !== m.channel_id) return;
      const empty = list.querySelector(".empty");
      if (empty) empty.remove();
      list.appendChild(render(m, !only));
      const max = Number(list.dataset.max || 0);
      while (max && list.children.length > max) list.firstElementChild.remove();
      if (list.dataset.follow !== undefined) window.scrollTo(0, document.body.scrollHeight);
    });
  });
  function link(href, text) {
    const a = document.createElement("a"); a.href = href; a.textContent = text; return a;
  }
  function render(m, showChannel) {
    const li = document.createElement("li"); li.className = "new";
    const meta = document.createElement("div"); meta.className = "meta";
    meta.append(String(m.id) + " · " + m.created_at.replace("T", " ").replace("Z", "") + " · ");
    meta.append(link("/agents/" + encodeURIComponent(m.agent), m.agent));
    if (showChannel) {
      meta.append(" in ");
      meta.append(link("/channels/" + encodeURIComponent(m.channel_id), "#" + m.channel_name));
    }
    const body = document.createElement("div"); body.className = "body"; body.textContent = m.body;
    li.append(meta, body);
    setTimeout(() => li.classList.remove("new"), 50);
    return li;
  }
})();
</script>
</body>
</html>
